# Enable True color support
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB:usstyle:clipboard:sync:focus,xterm-256color:RGB:usstyle'
# Passthrough lets pane output send raw escapes (e.g. OSC 52 clipboard writes) to Ghostty.
# Turn it back on only for image previews (kitty graphics) inside tmux.
set -g allow-passthrough off
set -g focus-events on

set -g base-index 1
set -g pane-base-index 1

set-option -g prefix C-b
set-option -g prefix2 none

unbind-key -n M-l
unbind-key -n M-k

# Only act when a shell is in front; other programs get the key unchanged
# (@pane-is-vim is set by nvim itself, so nvim behind a shell wrapper never counts as a shell)
%hidden is_shell='#{&&:#{!:#{@pane-is-vim}},#{m/r:^-?(zsh|bash|fish|sh)$,#{pane_current_command}}}'

# Clear screen (like 'clear' command)
bind-key -n M-l if -F "$is_shell" 'send-keys C-l' 'send-keys M-l'

# Clear screen and tmux scrollback history
# (wait for the shell's clear first: scroll-on-clear pushes the old screen into history)
bind-key -n M-k if -F "$is_shell" 'send-keys C-l ; run-shell -d 0.2 ; clear-history' 'send-keys M-k'

unbind r
bind r source-file ~/.config/tmux/tmux.conf

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind v
bind v copy-mode

# resizing panes with hjkl
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# maximize panes
bind -r m resize-pane -Z

# mouse support
set -g mouse on

# vim shell navigations and selects in tmux panes
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# Instant switch to a new tmux session directory that exist
bind-key f display-popup -E -w 80% -h 70% ~/scripts/tmux-sessionizer
bind-key n command-prompt "new-session -s '%%'"

# Drag copy using mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# tmux plugin manager 
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/.tmux/plugins
set -g @plugin 'tmux-plugins/tpm' # must be the first plugin

set -g @plugin 'omerxx/tmux-sessionx' # default keybind "<prefix> O" to activate
set -g @plugin "tmux-plugins/tmux-resurrect" #persist tmux sessions after computer restart

set -g @plugin 'catppuccin/tmux'

set -g @sessionx-bind 'o'
set -g @resurrect-capture-pane-contents "on" # saves scrollback in plaintext: keep ~/.local/share/tmux/resurrect at chmod 700

# vim/fzf-aware pane navigation (replaces the vim-tmux-navigator tmux plugin; the nvim side stays).
# Checks the pane's foreground command with a format, so no ps|grep fork per key press;
# the @pane-is-vim pane option (set by nvim on VimEnter/VimResume) also catches nvim started through a wrapper.
%hidden is_vim='#{||:#{@pane-is-vim},#{m/ri:^g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$,#{pane_current_command}}}'
bind-key -n C-h if -F "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if -F "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if -F "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if -F "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if -F "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key C-l send-keys C-l

# Configure Catppuccin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Load the theme now so the @thm_* colours exist for the -F options below (TPM loads it again at the end)
run '~/.config/tmux/.tmux/plugins/tmux/catppuccin.tmux'

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
# set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
# set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# status right look and feel
set -g status-right-length 100
set -g status-right "" # battery and network live in sketchybar
# set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
# set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "


# Configure Tmux
set -g status-position bottom
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"

# pane border look and feel
# setw -g pane-border-status top
# setw -g pane-border-format ""
# setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
# setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"
# setw -g pane-border-lines single

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"

run '~/.config/tmux/.tmux/plugins/tpm/tpm' # always keep this line last
